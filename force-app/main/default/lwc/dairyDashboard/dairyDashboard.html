<template>
    <lightning-card title="Dairy Operations" icon-name="standard:dashboard">
        <div class="slds-grid slds-wrap slds-gutters slds-p-around_medium">
            <template if:true={summary}>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"><div class="metric"><span>Farmers</span><strong>{summary.farmers}</strong></div></div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"><div class="metric"><span>Farms</span><strong>{summary.farms}</strong></div></div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"><div class="metric"><span>Cattle</span><strong>{summary.cattle}</strong></div></div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"><div class="metric"><span>Total Milk (L)</span><strong>{summary.totalMilkLiters}</strong></div></div>
            </template>
            <template if:true={error}><p class="slds-text-color_error">Unable to load dashboard data.</p></template>
        </div>
    </lightning-card>
</template>
